<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主页面 - Tab 切换</title>
<style>
  body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #89f7fe, #66a6ff);
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    margin-top: 30px;
    font-size: 2rem;
    color: #fff;
    text-shadow: 1px 1px 2px #000;
  }

  /* Tab 容器 */
  .tab-container {
    display: flex;
    justify-content: center;
    margin: 30px 0;
    flex-wrap: wrap;
  }

  .tab-button {
    background: rgba(255,255,255,0.2);
    border: none;
    padding: 15px 30px;
    margin: 5px;
    border-radius: 10px;
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.3s ease;
    color: #fff;
    text-shadow: 1px 1px 2px #000;
  }

  .tab-button:hover {
    background: rgba(255,255,255,0.5);
    transform: scale(1.05);
  }

  /* 内容区域 */
  .content {
    text-align: center;
    color: #fff;
    font-size: 1.2rem;
    max-width: 800px;
    padding: 20px;
  }

  /* 响应式 */
  @media(max-width: 600px){
    .tab-button {
      padding: 10px 20px;
      font-size: 1rem;
    }
  }
</style>
</head>
<body>

<h1>📅 我的工具页</h1>

<div class="tab-container">
  <button class="tab-button" onclick="goPage('calendar.html')">日历</button>
  <button class="tab-button" onclick="goPage('time.html')">时间</button>
  <button class="tab-button" onclick="goPage('todo.html')">代办事项</button>
</div>

<div class="content">
  <p>欢迎来到我的工具页！点击上面的按钮可以快速切换到不同功能：</p>
  <ul>
    <li>📅 日历查看日程 → calendar.html</li>
    <li>⏰ 实时时钟 → time.html</li>
    <li>📝 代办事项管理 → todo.html</li>
  </ul>
</div>

<script>
  function goPage(url){
    window.location.href = url;
  }
</script>

</body>
</html>
