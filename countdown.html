<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快乐倒计时</title>
<link rel="stylesheet" href="css/common.css">
<script src="js/favicon.js"></script>
<style>
  body {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1950&q=80') center/cover no-repeat;
    opacity: 0.15;
    z-index: -1;
    animation: fadebg 10s ease-in-out infinite alternate;
  }

  @keyframes fadebg {
    0%   { opacity: 0.1; }
    50%  { opacity: 0.2; }
    100% { opacity: 0.1; }
  }

  h1 { margin: 20px 0 6px; font-size: 2rem; text-align: center; }

  .quote {
    font-size: 1.1rem;
    margin-bottom: 20px;
    text-align: center;
    font-style: italic;
    opacity: 0.9;
  }

  /* 翻页时钟 */
  .clock {
    display: flex;
    justify-content: center;
    font-family: monospace;
    font-size: 3rem;
    margin-bottom: 30px;
  }

  .flip-card {
    background: rgba(0,0,0,0.6);
    color: #0f0;
    padding: 10px 20px;
    margin: 0 5px;
    border-radius: 10px;
  }

  /* 卡片网格 */
  .container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    width: 90%;
    max-width: 1200px;
    margin-bottom: 50px;
  }

  .card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    transition: transform 0.3s;
  }

  .card:hover { transform: translateY(-5px) scale(1.03); }
  .card-title { font-size: 1.4rem; margin-bottom: 8px; opacity: 0.9; }
  .card-countdown { font-size: 1.15rem; font-weight: bold; }

  @media (max-width: 600px) {
    .clock { font-size: 2rem; }
    .card-title { font-size: 1.1rem; }
    .card-countdown { font-size: 0.95rem; }
  }
</style>
</head>
<body>


<h1>🎉 快乐倒计时</h1>
<div class="quote" id="quote"></div>

<div class="clock">
  <div class="flip-card"><span id="hour">00</span></div>:
  <div class="flip-card"><span id="minute">00</span></div>:
  <div class="flip-card"><span id="second">00</span></div>
</div>

<div class="container" id="cards"></div>

<script src="js/quotes.js"></script>
<script src="js/countdown.js"></script>
<script src="js/dock.js"></script>
<script>
  // 励志语
  getRandomQuoteAsync().then(q => document.getElementById("quote").innerText = q);

  // 动态生成卡片（基于 COUNTDOWN_EVENTS 配置）
  const container = document.getElementById("cards");
  COUNTDOWN_EVENTS.forEach(evt => {
    container.innerHTML += `
      <div class="card">
        <div class="card-title">${evt.title}</div>
        <div class="card-countdown" id="${evt.id}"></div>
      </div>`;
  });

  // 时钟
  function updateClock() {
    const now = new Date();
    document.getElementById("hour").innerText = String(now.getHours()).padStart(2, '0');
    document.getElementById("minute").innerText = String(now.getMinutes()).padStart(2, '0');
    document.getElementById("second").innerText = String(now.getSeconds()).padStart(2, '0');
  }

  // 倒计时
  function updateCountdowns() {
    const now = new Date();
    COUNTDOWN_EVENTS.forEach(evt => {
      const el = document.getElementById(evt.id);
      if (el) el.innerText = formatCountdown(evt.getDate() - now);
    });
  }

  updateClock();
  updateCountdowns();
  setInterval(updateClock, 1000);
  setInterval(updateCountdowns, 1000);
</script>
<script>renderDock('countdown');</script>

</body>
</html>
