<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工具页</title>
<link rel="stylesheet" href="css/common.css">
<style>
  body {
    background: linear-gradient(135deg, #89f7fe, #66a6ff);
  }

  .hero {
    margin-top: 40px;
    text-align: center;
  }

  .hero h1 {
    font-size: 2.4rem;
    color: #fff;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
  }

  .hero p {
    color: rgba(255,255,255,0.85);
    font-size: 1.1rem;
    margin-top: 8px;
  }

  .nav-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    max-width: 960px;
    width: 90%;
    margin: 40px auto 60px;
  }

  .nav-card {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 30px 20px;
    text-align: center;
    text-decoration: none;
    color: #fff;
    transition: transform 0.3s, background 0.3s;
  }

  .nav-card:hover {
    transform: translateY(-6px) scale(1.03);
    background: rgba(255,255,255,0.35);
  }

  .nav-card .icon {
    font-size: 3rem;
    margin-bottom: 12px;
  }

  .nav-card .label {
    font-size: 1.3rem;
    font-weight: 600;
  }

  .nav-card .desc {
    font-size: 0.9rem;
    margin-top: 8px;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="hero">
  <h1>📅 我的工具页</h1>
  <p id="quote"></p>
</div>

<div class="nav-grid">
  <a class="nav-card" href="countdown.html">
    <div class="icon">🎉</div>
    <div class="label">快乐倒计时</div>
    <div class="desc">节日、生日、发薪日倒计时</div>
  </a>
  <a class="nav-card" href="calendar.html">
    <div class="icon">📅</div>
    <div class="label">日历</div>
    <div class="desc">月历视图，标记重要日期</div>
  </a>
  <a class="nav-card" href="clock.html">
    <div class="icon">⏰</div>
    <div class="label">时钟</div>
    <div class="desc">实时翻页时钟</div>
  </a>
  <a class="nav-card" href="todo.html">
    <div class="icon">📝</div>
    <div class="label">待办事项</div>
    <div class="desc">添加、完成、删除待办</div>
  </a>
</div>

<script src="js/quotes.js"></script>
<script>
  document.getElementById("quote").innerText = getRandomQuote();
</script>

</body>
</html>
