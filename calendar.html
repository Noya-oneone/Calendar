<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日历</title>
<link rel="stylesheet" href="css/common.css">
<style>
  body {
    background: linear-gradient(135deg, #a18cd1, #fbc2eb);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 { margin: 20px 0 10px; font-size: 2rem; }

  .cal-nav {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
  }

  .cal-nav button {
    background: rgba(255,255,255,0.25);
    border: none;
    color: #fff;
    font-size: 1.4rem;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .cal-nav button:hover { background: rgba(255,255,255,0.4); }
  .cal-nav .month-label { font-size: 1.5rem; font-weight: 600; min-width: 180px; text-align: center; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    width: 90%;
    max-width: 560px;
    margin-bottom: 50px;
  }

  .cal-header {
    text-align: center;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 8px 0;
    opacity: 0.8;
  }

  .cal-day {
    text-align: center;
    padding: 12px 0;
    border-radius: 10px;
    font-size: 1rem;
    position: relative;
    transition: background 0.2s;
  }

  .cal-day:not(.empty):hover { background: rgba(255,255,255,0.2); cursor: pointer; }
  .cal-day.today { background: rgba(255,255,255,0.35); font-weight: 700; }
  .cal-day.has-event::after {
    content: '';
    display: block;
    width: 6px; height: 6px;
    background: #ff6b6b;
    border-radius: 50%;
    margin: 4px auto 0;
  }

  .legend {
    margin-top: 10px;
    font-size: 0.85rem;
    opacity: 0.75;
    text-align: center;
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 返回首页</a>

<h1>📅 日历</h1>

<div class="cal-nav">
  <button id="prev">◀</button>
  <div class="month-label" id="monthLabel"></div>
  <button id="next">▶</button>
</div>

<div class="cal-grid" id="calGrid"></div>
<div class="legend">🔴 标记日期 = 重要事件（生日 / 节日 / 发薪日）</div>

<script src="js/countdown.js"></script>
<script>
  let currentYear, currentMonth;

  // 从 COUNTDOWN_EVENTS 生成每月重要日期
  function getEventDays(year, month) {
    const days = new Set();
    // 每月5号发薪
    if (month >= 0) days.add(5);
    // 遍历倒计时事件
    COUNTDOWN_EVENTS.forEach(evt => {
      const d = evt.getDate();
      if (d.getFullYear() === year && d.getMonth() === month) {
        days.add(d.getDate());
      }
    });
    return days;
  }

  function renderCalendar(year, month) {
    currentYear = year;
    currentMonth = month;

    const grid = document.getElementById("calGrid");
    const label = document.getElementById("monthLabel");
    label.textContent = `${year} 年 ${month + 1} 月`;

    const headers = ["日", "一", "二", "三", "四", "五", "六"];
    let html = headers.map(h => `<div class="cal-header">${h}</div>`).join("");

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const eventDays = getEventDays(year, month);

    for (let i = 0; i < firstDay; i++) {
      html += `<div class="cal-day empty"></div>`;
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = (year === today.getFullYear() && month === today.getMonth() && d === today.getDate());
      const hasEvent = eventDays.has(d);
      const classes = ["cal-day"];
      if (isToday) classes.push("today");
      if (hasEvent) classes.push("has-event");
      html += `<div class="${classes.join(" ")}">${d}</div>`;
    }

    grid.innerHTML = html;
  }

  document.getElementById("prev").addEventListener("click", () => {
    let m = currentMonth - 1, y = currentYear;
    if (m < 0) { m = 11; y--; }
    renderCalendar(y, m);
  });

  document.getElementById("next").addEventListener("click", () => {
    let m = currentMonth + 1, y = currentYear;
    if (m > 11) { m = 0; y++; }
    renderCalendar(y, m);
  });

  const now = new Date();
  renderCalendar(now.getFullYear(), now.getMonth());
</script>

</body>
</html>
